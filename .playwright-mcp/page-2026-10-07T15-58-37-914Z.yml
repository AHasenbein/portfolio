          - generic [ref=e235]: Penn State Honors Research
          - heading "Hyperoptimization of Artificial Intelligence-Based Quadratic Equation Predictors" [level=2] [ref=e241]
        - generic [ref=e242]:
          - paragraph [ref=e244]: A research project exploring how small neural networks learn mathematical function approximation, using quadratic root prediction as a controlled testbed for studying hyperparameter optimization. I implemented and compared three search strategies (Bayesian optimization, random search, and multi-objective Pareto search) to understand the trade-offs between model accuracy and efficiency. The project pairs a stratified data generation pipeline (balanced across real, complex, and repeated roots) with a comprehensive evaluation suite and a PyQt6 dashboard for visualizing training progress, hyperparameter importance, and trial history. The study trained 1,800 networks (20 seeds x 3 methods x 30 trials). Bayesian (TPE) search cut median best validation error 46.5% versus random search after 30 trials (paired Wilcoxon p = 0.002), with test R² of 0.986 vs 0.980. It is a small synthetic problem, and the goal wasn't to solve a hard problem, but to run a clean, well-instrumented experiment that surfaces practical, transferable lessons about optimizing small ML models.
